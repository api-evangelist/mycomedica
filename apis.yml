name: MycoMedica
description: MycoMedica Life Sciences, PBC is a clinical-stage biopharmaceutical company founded by
  mycologist Paul Stamets and backed by Obvious Ventures, True Ventures, and Kittyhawk Ventures. The
  company develops fungi-derived therapeutic drugs, including its lead psilocybin candidate MLS101 and
  the "Stamets Stack" (a novel blend of niacin, psilocybin, and lion's mane), for the prevention and
  treatment of psychiatric and neurological disorders. It raised $60 million in Series A funding in 2022
  and is advancing pre-clinical and clinical research toward FDA approval. MycoMedica is a life-sciences
  drug-development company and publishes no public developer API, documentation, or developer portal.
